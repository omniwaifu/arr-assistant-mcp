name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run tests
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Verify lockfile
        run: uv lock --check

      - name: Build and test Docker image
        run: bash scripts/test-container.sh

      - name: Audit installed dependencies
        run: uv run pip-audit --local

      - name: Install MCPB tooling
        run: npm ci --prefix .github/mcpb-tooling --ignore-scripts

      - name: Audit MCPB tooling
        run: npm audit --prefix .github/mcpb-tooling --audit-level=moderate

      - name: Validate MCPB manifest
        run: npm test --prefix .github/mcpb-tooling

      - name: Validate MCPB manifest with CLI
        run: npm exec --prefix .github/mcpb-tooling -- mcpb validate manifest.json

      - name: Pack MCPB bundle
        run: npm exec --prefix .github/mcpb-tooling -- mcpb pack . /tmp/arr-assistant-mcp.mcpb

      - name: Inspect MCPB bundle
        run: npm exec --prefix .github/mcpb-tooling -- mcpb info /tmp/arr-assistant-mcp.mcpb
